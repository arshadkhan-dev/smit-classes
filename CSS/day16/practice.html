<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid Practice</title>
    <style>
      .container {
        width: 70vw;
        height: 70vh;
        padding: 10px;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 1fr 1.4fr 4fr 1fr;
        gap: 5px;
      }

      .grid-box {
        border: 1px solid;
        background-color: rgb(220, 20, 20);
        color: white;
      }

      .box1 {
        grid-column-start: 1;
        grid-column-end: 5;
      }

      .box5 {
        grid-column-start: 4;
        grid-column-end: 5;
        grid-row-start: 2;
        grid-row-end: 4;
      }

      .box6 {
        grid-column-start: 1;
        grid-column-end: 4;
      }

      .box7 {
        grid-column-start: 1;
        grid-column-end: 5;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="grid-box box1">Header</div>
      <div class="grid-box box2">small box1</div>
      <div class="grid-box box3">small box2</div>
      <div class="grid-box box4">small box3</div>
      <div class="grid-box box5">Sidebar</div>
      <div class="grid-box box6">Main Content</div>
      <div class="grid-box box7">Footer</div>
    </div>
  </body>
</html>
