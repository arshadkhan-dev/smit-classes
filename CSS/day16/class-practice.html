<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Class Practice using Grid</title>
    <style>
      /* .tldr */

      /* body { */
      /* display: grid;
        align-items: center;
        justify-content: center; */

      /* display: flex;
        justify-content: center;
        align-items: center; */
      /* } */

      .container {
        height: 70vh;
        width: 80vh;
        /* border: 1px solid; */
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: 1fr 5fr;
        gap: 5px;
      }

      .grid-item {
        /* height: 100px;
        width: 100px; */
        border: 1px solid;
        background-color: rgb(143, 172, 181);
        border-radius: 5px;
      }

      .item5 {
        grid-column-start: 1;
        grid-column-end: 3;
      }
      .item6 {
        grid-column-start: 3;
        grid-column-end: 5;
      }
    </style>
  </head>
  <body>
    <h2>Template A</h2>
    <div class="container">
      <div class="grid-item item1"></div>
      <div class="grid-item item2"></div>
      <div class="grid-item item3"></div>
      <div class="grid-item item4"></div>
      <div class="grid-item item5"></div>
      <div class="grid-item item6"></div>
    </div>
  </body>
</html>
