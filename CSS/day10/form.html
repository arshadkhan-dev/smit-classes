<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Form</title>

    <style>
      form {
        border: 2px solid;
        padding: 20px;
        width: 300px;
        margin: auto;
        border-radius: 5px;
        margin-top: 20px;
        box-shadow: 2px 2px 10px blue;
        font-size: 20px;
      }

      h2 {
        text-align: center;
        margin: 0;
      }

      input[type="text"],
      input[type="email"],
      input[type="password"] {
        padding: 8px;
        margin: 10px;
        width: 100%;
        box-sizing: border-box;
      }

      input[type="submit"] {
        padding: 8px;
        margin: 10px 0;
        background-color: blue;
        color: white;
        border: none;
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <form action="">
      <h2>Form</h2>
      <div>
        <label for="name">Name:</label>
        <input type="text" name="name" id="name" placeholder="enter name" />
      </div>
      <div>
        <label for="email">Email:</label>
        <input
          type="email"
          name="email"
          id="email"
          placeholder="abc@gmail.com"
        />
      </div>
      <div>
        <label for="password">Password:</label>
        <input
          type="password"
          name="password"
          id="password"
          placeholder="....."
        />
      </div>
      <div>
        <label for="gender">Gender:</label>
        <input type="radio" name="gender" id="male" />Male
        <input type="radio" name="gender" id="female" />Female
      </div>
      <input type="submit" />
    </form>
  </body>
</html>
