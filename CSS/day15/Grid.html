<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Grid in CSS</title>
    <style>
      * {
        margin: 0;
        padding: 0;
      }
      .container {
        border: 1px solid;
        height: 80vh;
        width: 100vw;
        display: grid;
        padding: 0;
        box-sizing: border-box;
        margin: 0;
        /* grid-template-columns: 100px auto 100px 120px; */
        /* grid-template-columns: 100px 100px 100px 100px; */
        /* grid-template-columns: repeat(3, 100px); */
        /* grid-template-columns: 100px 100px auto; */
        /* grid-template-columns: 2fr 100px 1fr; */
        /* grid-template-columns: 100px 100px; */
        /* grid-template-rows: 100px 100px auto; */

        /* Horizental Alignments */
        /* justify-items: start; */
        /* justify-items: center; */
        /* justify-items: end; */

        /* Vertical Alignments */
        /* align-items: start; */
        /* align-items: center; */
        /* place-items: center; */

        grid-template-columns: 100px auto 100px;
      }

      .grid-item {
        border: 1px solid;
      }

      nav {
        height: 10vh;
        width: 100vw;
        background-color: blue;
        padding: 0;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <header>
      <nav></nav>
    </header>
    <main>
      <div class="container">
        <div class="grid-item"></div>
        <div class="grid-item"></div>
        <div class="grid-item"></div>
      </div>
    </main>
    <footer>
      <nav></nav>
    </footer>
  </body>
</html>
