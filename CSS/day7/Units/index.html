  <body>
    <!-- Units in CSS -->
    <!-- Two Types of Units -->
    <!-- Absolute (px, cm etc) (independent | fixed) -->
    <!-- Relative (rem,em, %, (view port) -> vw, vh (dependent)) -->
    <!-- %, vw, vh are used for height and width -->
    <!-- rem, em are used for font-size -->

    <!-- % does not apply on height -->
    <!-- rem (root element) works with root element (html) -->
    <!-- em(element) works with parent element -->

    <!-- 1rem = 16px (default) -->

    <div class="container">
      Lorem ipsum dolor sit amet.
      <p>
