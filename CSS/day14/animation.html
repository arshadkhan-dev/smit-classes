<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Animation</title>
    <style>
      .container {
        width: 100px;
        height: 100px;
        border: 1px solid;
        margin: 40px 40px;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        background-color: blue;
        color: white;
        /* animation-name: identifier;
        animation-duration: 2s; */
        /* animation-delay: 2s; */
        /* animation-iteration-count: infinite; */
        /* animation-iteration-count: initial; */

        animation-name: changeColors;
        animation-duration: 1s;
        /* animation-iteration-count: infinite; */
        animation-timing-function: linear;
      }

      .container:hover {
        animation-play-state: paused;
      }

      /* @keyframes identifier {
        from {
          transform: translateX(0px);
        }
        to {
          transform: translate(500px);
          border-radius: 10px;
          width: 200px;
          height: 200px;
          transform: scale(1.5);
        }
      } */

      @keyframes changeColors {
        from {
          transform: translateY(0);
          background-color: green;
        }
        to {
          transform: translateY(300px);
          background-color: yellow;
        }
        /* 0% {
          border-radius: 50px;
          transform: translateX(0px);
          background-color: red;
        }

        50% {
          border-radius: 30px;
          background-color: yellow;
        }
        100% {
          border-radius: 10px;
          background-color: blue;
          transform: translateX(500px);
        } */
      }

      .loading {
        width: 100px;
        height: 100px;
        border-top: 2px solid black;
        display: flex;
        justify-content: center;
        align-items: center;
        margin: auto;
        border-radius: 50%;
        box-shadow: 3px 3px 5px black;
        background-color: rgb(230, 211, 208);
        animation-name: Loading;
        animation-duration: 1s;
        animation-timing-function: linear;
        /* animation-iteration-count: infinite; */
        /* animation-fill-mode: backwards; */
        /* animation-fill-mode: forwards; */
        /* animation-timing-function:;ease-out; */
      }

      @keyframes Loading {
        from {
          transform: rotate(0);
        }
        to {
          transform: rotate(360deg);
        }
      }

      .bounce {
        height: 100px;
        width: 100px;
        margin: auto;
        border-radius: 50%;
        background-color: green;
        border: 1px solid;
        animation-name: bounce;
        animation-duration: 1s;
        animation-iteration-count: infinite;
        animation-timing-function: linear;
        animation-direction: alternate-reverse;
      }

      /* @keyframes bounce {
        100% {
          transform: translateY(300px);
        }
        0% {
          transform: translateY(0);
        }
      } */

      .square {
        width: 100px;
        height: 100px;
        background-color: rgb(29, 70, 70);
        position: relative;
        border-radius: 50%;
        animation-name: Move;
        animation-duration: 2s;
        animation-timing-function: linear;
      }

      @keyframes Move {
        0% {
          /* transform: translateX(0px); */
          top: 0;
          left: 0;
        }
        25% {
          /* transform: translateX(400px); */
          top: 0;
          left: 400px;
        }
        50% {
          /* transform: translateY(300px); */
          left: 0;
          top: 400px;
        }
        75% {
          /* transform: translateX(-300px); */
          top: 0;
          left: 400px;
        }
        100% {
          left: 0;
          top: 400px;
        }
      }
    </style>

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"
    />
  </head>
  <body>
    <!-- <div class="container">SMIT</div> -->
    <!-- <div class="loading"></div> -->
    <!-- <div class="bounce"></div> -->
    <!-- <div class="square"></div> -->
    <h1 class="animate__animated animate__swing">An animated element</h1>

    <!-- Animate css (a website for built in animation) -->
  </body>
</html>
